# Make DKMS module signing explicit (dkms 3.x auto-detects this path too,
# but pinning it survives shim-signed / dkms reconfiguration). Every module
# DKMS builds is signed with this machine-owner key; enroll the matching
# certificate once (see deploy/secureboot/enroll-mok.sh) and Secure Boot
# stays on across kernel updates.
mok_signing_key="/var/lib/shim-signed/mok/MOK.priv"
mok_certificate="/var/lib/shim-signed/mok/MOK.der"
