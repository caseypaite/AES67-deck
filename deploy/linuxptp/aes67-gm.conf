# AES67 media-clock grandmaster for ck-aes67 (Path 2 — this box is the
# clock master for the AES67 network). SOFTWARE timestamping on enp3s0;
# the frequency comes from the free-running I217 PHC via
# phc2sys-crystal.service, which owns CLOCK_REALTIME (chrony must be
# stopped/masked while this runs — see the unit's Conflicts=).
#
# ptp_domain here MUST match /etc/daemon.conf "ptp_domain" (default 0).
# When the replacement hardware-PTP NIC arrives: move [enp3s0] -> the new
# interface and set time_stamping = hardware.

[global]
domainNumber            0
priority1               128
priority2               128
clockClass              248
clockAccuracy           0xFE
offsetScaledLogVariance 0xFFFF
free_running             1
time_stamping            software
tx_timestamp_timeout     50
twoStepFlag              1
serverOnly               1
network_transport        UDPv4
delay_mechanism          E2E
logAnnounceInterval      0
logSyncInterval         -3
logMinDelayReqInterval  -3
announceReceiptTimeout   3
summary_interval         6
ptp_dst_mac             01:1B:19:00:00:00
udp_ttl                  1

[enp3s0]
