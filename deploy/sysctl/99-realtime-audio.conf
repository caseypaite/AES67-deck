# AES67-Deck realtime audio tuning
# Managed by provisioning — see ~/aes67-deck/docs/latency-tuning.md

# Disable the RT scheduler throttle. On a dedicated audio appliance the
# engine's RT threads (rtprio <= 95) must never be throttled; kernel
# threads at rtprio 99 still preempt them.
kernel.sched_rt_runtime_us = -1

# Keep the working set resident — avoid paging out the audio stack.
vm.swappiness = 10

# Larger socket buffers for AES67/RTP multicast bursts and PTP.
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# Headroom for dev tooling / file watchers.
fs.inotify.max_user_watches = 524288
