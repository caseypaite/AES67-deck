# AES67-Deck: lock PipeWire to a fixed 48 kHz clock at a low-latency quantum.
# Matches the AES67/RAVENNA network clock so nothing is resampled off-rate.
# quantum=128 (~2.7 ms) validated xrun-free with the performance CPU profile
# — see ~/aes67-deck/docs/latency-tuning.md.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 128
    default.clock.min-quantum   = 128
    default.clock.max-quantum   = 2048
}
