# AES67-Deck: lock PipeWire to 48 kHz, quantum 48 (1 ms).
#
# The RAVENNA card (AES67_Sink) is the graph clock master — see
# wireplumber/53-aes67-clock-master.conf. The Merging driver hard-forces a
# 96-sample ALSA buffer (period 48 x 2 periods; larger period-num is
# ignored), so the graph quantum has to phase-lock to its 1 ms PTP tic.
# A larger quantum (128 was tried) overflows that 96-sample buffer once
# RAVENNA drives and made the network output *worse* (~500 xruns/s).
# min == max pins it hard; nothing on this box needs a bigger buffer.
context.properties = {
    default.clock.rate                 = 48000
    default.clock.allowed-rates        = [ 48000 ]
    default.clock.quantum              = 48
    default.clock.min-quantum          = 48
    default.clock.max-quantum          = 48
    default.clock.power-of-two-quantum = false
}
