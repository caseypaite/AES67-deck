# AES67-Deck: expose the RAVENNA virtual ALSA card as independent
# PipeWire sink + source nodes (routed separately in the mixer patchbay).
# period-size=48 (1 ms, the AES67 TIC frame size) is the driver's real
# minimum — see ~/aes67-deck/docs/latency-tuning.md.
context.objects = [
    { factory = adapter
        args = {
            factory.name         = api.alsa.pcm.sink
            node.name            = "AES67_Sink"
            node.description     = "AES67/RAVENNA Network Audio Out"
            media.class          = "Audio/Sink"
            api.alsa.path        = "hw:RAVENNA"
            api.alsa.period-size = 48
            audio.channels       = 2
            audio.rate           = 48000
            audio.format         = "S32LE"
            audio.position       = "[ FL FR ]"
            session.suspend-timeout-seconds = 0
        }
        flags = [ nofail ]
    }
    { factory = adapter
        args = {
            factory.name         = api.alsa.pcm.source
            node.name            = "AES67_Source"
            node.description     = "AES67/RAVENNA Network Audio In"
            media.class          = "Audio/Source"
            api.alsa.path        = "hw:RAVENNA"
            api.alsa.period-size = 48
            audio.channels       = 2
            audio.rate           = 48000
            audio.format         = "S32LE"
            audio.position       = "[ FL FR ]"
            session.suspend-timeout-seconds = 0
        }
        flags = [ nofail ]
    }
]
