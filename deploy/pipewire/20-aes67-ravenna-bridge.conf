# AES67-Deck: expose the RAVENNA virtual ALSA card as independent
# PipeWire sink + source nodes (routed separately in the mixer patchbay).
#
# The Merging driver requires the ALSA period to EQUAL its PTP tic frame
# size (tic_frame_size_at_1fs = 48 in /etc/daemon.conf) — it rejects any
# other period ("periodSize (N) differs from ptp_frame_size (48)"). So pin
# period-size = 48 and a small period-num; do NOT let PipeWire pick these
# from the graph quantum. See ~/aes67-deck/docs/latency-tuning.md.
#
# Channel counts (Phase 2 of plan/unified-aes67-network-control.md):
#   AES67_Sink   = 20  playout ch  -> the deck's 20 mix-product channels
#                  (Master L/R, Monitor L/R, then bus_101..108 L/R). The
#                  server pins the engine->sink link map in applyBroadcastRouting().
#   AES67_Source = 32  capture ch  -> subscribed daemon Sinks are auto-mapped
#                  onto contiguous blocks here (server reconcileRxSinks()).
# Both share the single hw:RAVENNA PCM (one playback substream, one capture);
# 20 + 32 is well under the driver's channels_max = 128 each way. Custom
# AUXn positions -> ports "AES67_Sink:playback_AUX0..19" /
# "AES67_Source:capture_AUX0..31". Re-verify the negotiated hw_params
# (/proc/asound/card0/pcm0{p,c}/sub0/hw_params) once a GM is present.
context.objects = [
    { factory = adapter
        args = {
            factory.name          = api.alsa.pcm.sink
            node.name             = "AES67_Sink"
            node.description      = "AES67/RAVENNA Network Audio Out"
            media.class           = "Audio/Sink"
            api.alsa.path         = "hw:RAVENNA"
            api.alsa.period-size  = 48
            api.alsa.period-num   = 2
            api.alsa.headroom     = 0
            api.alsa.disable-batch = true
            api.alsa.disable-tsched = true
            audio.channels        = 20
            audio.rate            = 48000
            audio.format          = "S32LE"
            audio.position        = "[ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 AUX6 AUX7 AUX8 AUX9 AUX10 AUX11 AUX12 AUX13 AUX14 AUX15 AUX16 AUX17 AUX18 AUX19 ]"
            session.suspend-timeout-seconds = 0
        }
        flags = [ nofail ]
    }
    { factory = adapter
        args = {
            factory.name          = api.alsa.pcm.source
            node.name             = "AES67_Source"
            node.description      = "AES67/RAVENNA Network Audio In"
            media.class           = "Audio/Source"
            api.alsa.path         = "hw:RAVENNA"
            api.alsa.period-size  = 48
            api.alsa.period-num   = 2
            api.alsa.headroom     = 0
            api.alsa.disable-batch = true
            api.alsa.disable-tsched = true
            audio.channels        = 32
            audio.rate            = 48000
            audio.format          = "S32LE"
            audio.position        = "[ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 AUX6 AUX7 AUX8 AUX9 AUX10 AUX11 AUX12 AUX13 AUX14 AUX15 AUX16 AUX17 AUX18 AUX19 AUX20 AUX21 AUX22 AUX23 AUX24 AUX25 AUX26 AUX27 AUX28 AUX29 AUX30 AUX31 ]"
            session.suspend-timeout-seconds = 0
        }
        flags = [ nofail ]
    }
]
