# AES67-Deck: expose the RAVENNA virtual ALSA card as independent
# PipeWire sink + source nodes.
#
# The Merging driver hard-forces period-size == PTP tic frame (48) and
# period-num == 2 (96-sample card buffer — larger period-num is ignored),
# so the graph quantum must phase-lock to the 1 ms tic (48, see
# 10-aes67-clock-48khz.conf).
#
# CLOCK MASTER: priority.driver = 100000 makes the PTP-locked RAVENNA card
# clock the whole graph, above the on-board analog crystal (demoted to 100
# in wireplumber/53-aes67-clock-master.conf). Without this the analog drives
# and AES67_Sink, a follower, is rate-adapted against a drifting local clock
# its 96-sample buffer can't absorb -> hundreds of xruns/s on the network.
# clock.name ties sink+source to the one hw:RAVENNA clock domain.
context.objects = [
    { factory = adapter
        args = {
            factory.name          = api.alsa.pcm.sink
            node.name             = "AES67_Sink"
            node.description      = "AES67/RAVENNA Network Audio Out"
            media.class           = "Audio/Sink"
            api.alsa.path         = "hw:RAVENNA"
            api.alsa.period-size  = 48
            api.alsa.period-num   = 2
            api.alsa.headroom     = 0
            api.alsa.disable-batch = true
            api.alsa.disable-tsched = true
            priority.driver       = 100000
            # NEVER an app-output default — it's the network bridge. Apps go
            # to AES67_System_Audio (priority.session 2000 in 30-*).
            priority.session      = 100
            clock.name            = "aes67.ravenna"
            node.pause-on-idle    = false
            audio.channels        = 21
            audio.rate            = 48000
            audio.format          = "S32LE"
            audio.position        = "[ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 AUX6 AUX7 AUX8 AUX9 AUX10 AUX11 AUX12 AUX13 AUX14 AUX15 AUX16 AUX17 AUX18 AUX19 AUX20 ]"
            session.suspend-timeout-seconds = 0
        }
        flags = [ nofail ]
    }
    { factory = adapter
        args = {
            factory.name          = api.alsa.pcm.source
            node.name             = "AES67_Source"
            node.description      = "AES67/RAVENNA Network Audio In"
            media.class           = "Audio/Source"
            api.alsa.path         = "hw:RAVENNA"
            api.alsa.period-size  = 48
            api.alsa.period-num   = 2
            api.alsa.headroom     = 0
            api.alsa.disable-batch = true
            api.alsa.disable-tsched = true
            priority.driver       = 90000
            priority.session      = 100
            clock.name            = "aes67.ravenna"
            node.pause-on-idle    = false
            # Capture from hw:RAVENNA continuously even with nothing routed
            # downstream — the aes67-daemon writes received RTP into this PCM
            # and mutes the whole RX sink (`all_muted`) if it can't (i.e. if
            # PipeWire has the capture device closed).
            node.always-process   = true
            audio.channels        = 32
            audio.rate            = 48000
            audio.format          = "S32LE"
            audio.position        = "[ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 AUX6 AUX7 AUX8 AUX9 AUX10 AUX11 AUX12 AUX13 AUX14 AUX15 AUX16 AUX17 AUX18 AUX19 AUX20 AUX21 AUX22 AUX23 AUX24 AUX25 AUX26 AUX27 AUX28 AUX29 AUX30 AUX31 ]"
            session.suspend-timeout-seconds = 0
        }
        flags = [ nofail ]
    }
]
