# AES67-Deck: expose the RAVENNA virtual ALSA card as independent
# PipeWire sink + source nodes (routed separately in the mixer patchbay).
#
# The Merging driver requires the ALSA period to EQUAL its PTP tic frame
# size (tic_frame_size_at_1fs = 48 in /etc/daemon.conf) — it rejects any
# other period ("periodSize (N) differs from ptp_frame_size (48)"). So pin
# period-size = 48 and a small period-num; do NOT let PipeWire pick these
# from the graph quantum. See ~/aes67-deck/docs/latency-tuning.md.
context.objects = [
    { factory = adapter
        args = {
            factory.name          = api.alsa.pcm.sink
            node.name             = "AES67_Sink"
            node.description      = "AES67/RAVENNA Network Audio Out"
            media.class           = "Audio/Sink"
            api.alsa.path         = "hw:RAVENNA"
            api.alsa.period-size  = 48
            api.alsa.period-num   = 2
            api.alsa.headroom     = 0
            api.alsa.disable-batch = true
            api.alsa.disable-tsched = true
            audio.channels        = 2
            audio.rate            = 48000
            audio.format          = "S32LE"
            audio.position        = "[ FL FR ]"
            session.suspend-timeout-seconds = 0
        }
        flags = [ nofail ]
    }
    { factory = adapter
        args = {
            factory.name          = api.alsa.pcm.source
            node.name             = "AES67_Source"
            node.description      = "AES67/RAVENNA Network Audio In"
            media.class           = "Audio/Source"
            api.alsa.path         = "hw:RAVENNA"
            api.alsa.period-size  = 48
            api.alsa.period-num   = 2
            api.alsa.headroom     = 0
            api.alsa.disable-batch = true
            api.alsa.disable-tsched = true
            audio.channels        = 2
            audio.rate            = 48000
            audio.format          = "S32LE"
            audio.position        = "[ FL FR ]"
            session.suspend-timeout-seconds = 0
        }
        flags = [ nofail ]
    }
]
