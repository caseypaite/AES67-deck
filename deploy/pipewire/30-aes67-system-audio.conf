# AES67-Deck: capture everything this machine plays — browser, media
# players, notification sounds — into the mixer as one stereo channel,
# identically on the dev workstation and the ck-aes67 appliance.
#
# Creates a virtual sink "AES67 System Audio". The deck server makes it the
# machine's default output (`pactl set-default-sink`, ensureSystemAudioDefault()
# in server/src/index.ts, re-asserted on every engine reconnect; WirePlumber
# then persists the choice) and links this node's output to a mixer input
# channel via the patchbay (default: channel 1 — DEFAULT_PATCHBAY_MAPPINGS).
#
# Deliberately NO node.target: system audio only ever reaches the mixer,
# never the AES67 wire or the local speakers directly. It rides the desk
# from there — fader it, mute it, insert FX, and route the Master / an Aux
# to a transmit Source or the Monitor bus to the headphone out as usual.
context.modules = [
    { name = libpipewire-module-loopback
        args = {
            node.description = "AES67 System Audio"
            capture.props = {
                node.name        = "AES67_System_Audio"
                media.class      = "Audio/Sink"
                audio.channels   = 2
                audio.position   = [ FL FR ]
                audio.rate       = 48000
                # Win the default-sink election outright. AES67_Sink /
                # AES67_Source carry priority.session = 100 (they're the
                # network bridge, never an app target); the on-board analog
                # card sits at ~1009. 2000 keeps apps here even when the deck
                # server hasn't (re-)asserted the default yet.
                priority.session = 2000
            }
            playback.props = {
                node.name        = "AES67_System_Audio_Loopback"
                node.description  = "AES67 System Audio → mixer"
                audio.channels   = 2
                audio.position   = [ FL FR ]
                audio.rate       = 48000
                # The deck server owns this link (pw-link to AES67_Deck:in_N).
                # Keep the session manager from auto-routing it anywhere —
                # in particular back into the default sink, which is this
                # very node's capture side (a feedback loop).
                node.autoconnect  = false
                stream.dont-remix = true
            }
        }
        flags = [ nofail ]
    }
]
