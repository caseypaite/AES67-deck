# AES67-Deck: make the PTP-locked RAVENNA card the PipeWire graph clock.
#
# By default the on-board analog output wins the driver election
# (priority.driver ~1009) and clocks the whole graph off its free-running
# crystal. AES67_Sink then follows and is continuously rate-adapted against
# that drifting clock — its 96-sample card buffer can't absorb it, so the
# network output runs hundreds of xruns per second.
#
# AES67_Sink / AES67_Source are promoted to priority.driver 100000 / 90000
# in pipewire/20-aes67-ravenna-bridge.conf; this drop-in demotes the analog
# output well below them so RAVENNA drives. The analog then follows and
# resamples PTP -> local crystal, which is inaudible on the monitor feed.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*analog.*" } ]
    actions = { update-props = { priority.driver = 10 } }
  }
]
