# AES67-Deck: never idle-suspend the RAVENNA / AES67 nodes — suspending
# them tears down the whole network audio graph.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_.*[Rr][Aa][Vv][Ee][Nn][Nn][Aa].*" }
    ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]

node.rules = [
  {
    matches = [
      { node.name = "AES67_Sink" }
      { node.name = "AES67_Source" }
    ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
