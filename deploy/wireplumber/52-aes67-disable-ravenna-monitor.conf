# The RAVENNA card is managed directly by PipeWire's context.objects
# bridge (deploy/pipewire/20-aes67-ravenna-bridge.conf -> AES67_Sink /
# AES67_Source, period 48, S32LE). Stop WirePlumber's generic ALSA
# monitor from also creating nodes for hw:RAVENNA — two openers of the
# same device race for it (EBUSY) and the monitor's are mis-parameterised
# ("stereo-fallback").
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*merging_rav.*" }
      { device.name = "~alsa_card.*[Rr]avenna.*" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
]
